[package]
name = "fleet-probe"
version = "0.1.0"
edition = "2021"
description = "团队线路管理 relayd 的逐项探测：L1 TCP、L2 经 Shadowsocks 验证出口 IP（含控制路径）、UDP STUN、IPv6 出口；边缘 SQLite 24 h 与推送批次"
publish = false

[lib]
name = "fleet_probe"
path = "src/lib.rs"

[[bin]]
name = "fleet-probe"
path = "src/bin/fleet-probe.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
# 关掉 runtime 只剩数据类型与 JSON 契约（fleetd / health 只需要这些，不引入 tokio、rustls、SQLite）
runtime = ["dep:tokio", "dep:rustls", "dep:webpki-roots", "dep:ring", "dep:md-5", "dep:blake3", "dep:base64", "dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
ring = { version = "0.17", optional = true }
md-5 = { version = "0.10", optional = true }
blake3 = { version = "1", optional = true, default-features = false, features = ["pure"] }
base64 = { version = "0.22", optional = true }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }

# 已收进 fleet/Cargo.toml 的 workspace（fleetd 接入，见 WIRING.md）。单独构建：cargo build -p <本包>

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
