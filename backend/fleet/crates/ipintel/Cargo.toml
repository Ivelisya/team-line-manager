[package]
name = "ipintel"
version = "0.1.0"
edition = "2021"
description = "团队线路管理 IP 情报：离线库（ip2region / DB-IP / iptoasn）富化、来源画像、出口历史、异常检测"
publish = false

# 注意：本 crate 以后要加进 fleet/Cargo.toml 的 workspace members（见 WIRING.md）。
# 依赖版本与 fleetd 对齐（axum 0.8、rusqlite 0.40 bundled、serde_json preserve_order），避免同一 workspace 里出现两份 libsqlite3-sys。

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
rusqlite = { version = "0.40", features = ["bundled"] }
maxminddb = { version = "0.32", features = ["mmap"] }
memmap2 = "0.9"
regex = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
