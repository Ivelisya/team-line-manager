[package]
name = "fleetd"
version = "0.14.0"
edition = "2021"
description = "团队线路管理 fleetd：原生旧库喂数与旧形状接口、边缘上报、SSE、告警引擎、套餐与资产、上架"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
bytes = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
form_urlencoded = "1"
psl = "2"
libc = "0.2"
# musl 自带的 malloc（mallocng）很慢：Value 的克隆 / 释放占了近三成 CPU
mimalloc = { version = "0.1", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }

ipintel = { path = "../crates/ipintel" }
fleet-health = { path = "../crates/health" }
fleet-probe = { path = "../crates/probe", default-features = false }
fleet-onboard = { path = "../crates/onboard" }
fleetd-ingest = { path = "../../fleet-edge/fleetd-ingest" }

pprof = { version = "0.14", default-features = false, features = ["frame-pointer"], optional = true }

[features]
# 采样剖析（本机 GET /v2/api/v1/debug/profile?seconds=N，折叠栈文本）；平时不编进去
profile = ["dep:pprof"]

[dev-dependencies]
tempfile = "3"
