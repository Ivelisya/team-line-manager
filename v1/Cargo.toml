[workspace]
resolver = "2"
members = ["crates/fleet-proto", "crates/fleet-server", "crates/fleet-agent", "crates/fleetctl", "crates/fleet-ipintel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fleet-proto = { path = "crates/fleet-proto" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
toml = "0.8"

# 调试 / 测试构建里不优化的 argon2 算一次约 0.5 秒（每个集成测试建管理员、登录各一次）：只给它和它用的 blake2 开优化
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
