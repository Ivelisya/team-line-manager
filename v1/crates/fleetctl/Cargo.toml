[package]
name = "fleetctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "团队线路管理 运维命令行（AI 与人共用）"

[[bin]]
name = "fleetctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# local-offset：silence add --start 按本机时区解析
time = { workspace = true, features = ["local-offset"] }
toml.workspace = true
# gzip：中控的响应都过 CompressionLayer，机器列表、作业日志这类大 JSON 压缩后小一个数量级
reqwest = { workspace = true, features = ["blocking", "gzip"] }
clap = { version = "4", features = ["derive", "env"] }
# 实时流（watch）：阻塞式 WebSocket，TLS 与 reqwest 共用 rustls
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
