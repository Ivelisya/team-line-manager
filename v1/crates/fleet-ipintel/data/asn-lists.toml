# 内置默认的 ASN 分类清单（编译进二进制）。可用 /etc/fleet/ipintel-overrides.toml 覆盖或追加：
# 同样的 [[分类]] 写法，后出现的条目盖过前面的；name = "" 表示把这些 ASN 从该分类里删掉。
# cn_mixed 追加用 cn_mixed，删除用 cn_mixed_remove。
#
# 判定顺序见 src/classify.rs 顶部：vpn → cloud → hosting → mobile（均 high）→ 名称关键词 → 机房集合 →
# cn_mixed（residential low，alt=mobile）→ fixed（residential medium）→ unknown。

# ── cn_mixed：中国三大运营商骨干 / 省网，家宽和手机流量共用，离线库分不开 → residential（low，alt=mobile）──
cn_mixed = [4134, 4812, 4837, 4808, 17621, 17622, 17623, 17816, 9808, 24445, 24400, 24444, 24547, 38019, 56040, 56041, 56042, 56044, 56046, 56047, 56048, 4809, 4847, 10099, 58453]

