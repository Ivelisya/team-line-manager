[package]
name = "fleet-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-ipintel = { path = "../fleet-ipintel" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# 请求体解析失败时取 serde 的错误路径（axum 的 Json 已经用它解析，同一个版本，见 error.rs）
serde_path_to_error = "0.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
rand.workspace = true
base64.workspace = true
reqwest.workspace = true
toml.workspace = true
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "decompression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json", "ipnetwork"] }
ipnetwork = "0.20"
argon2 = "0.5"
chacha20poly1305 = "0.10"
futures = "0.3"
libc = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# 两步验证：TOTP（HMAC-SHA1）、密钥的 base32、二维码只要 SVG 输出
hmac = "=0.12.1"
sha1 = "=0.10.7"
data-encoding = "=2.11.1"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
# 软路由：隧道密钥（OpenSSH 格式的 ed25519，私钥只进接入脚本）；路由上 OpenClash 配置的 YAML 只在内存里解析出口。
# serde-saphyr：维护中，纯 Rust（不经 unsafe-libyaml），按目标类型解析标量（short-id 写成 01234567 时原样保留），
# 默认带资源上限（别名、节点数、深度），被攻破的路由交来的「十亿笑」YAML 撑不爆中控；serde_yaml 已停止维护
ed25519-dalek = "=2.2.0"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "=3.27.0"
tokio-tungstenite = "0.29"
