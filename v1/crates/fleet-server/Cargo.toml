[package]
name = "fleet-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-ipintel = { path = "../fleet-ipintel" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
base64.workspace = true
reqwest.workspace = true
toml.workspace = true
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json", "ipnetwork"] }
ipnetwork = "0.20"
argon2 = "0.5"
chacha20poly1305 = "0.10"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "=3.27.0"
