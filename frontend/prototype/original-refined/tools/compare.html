<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>原版 / 精修 并排</title>
  <link rel="stylesheet" href="../../original/tokens.css">
  <style>
    /* 验收 V1 用：原版截图与精修截图并排（?a=原版路径&b=精修路径&la=标题&lb=标题&w=单张宽） */
    body { margin: 0; padding: var(--sp-16); background: var(--canvas); }
    .pair { display: flex; gap: var(--sp-16); align-items: flex-start; }
    figure { margin: 0; display: grid; gap: var(--sp-8); }
    figcaption { font: var(--fw-semibold) var(--fs-body) / var(--lh-body) var(--font-sans); color: var(--fg); }
    figcaption span { font-weight: var(--fw-regular); color: var(--fg-2); margin-left: var(--sp-8); }
    img { display: block; border: 1px solid var(--line); border-radius: var(--r-float); }
  </style>
</head>
<body>
  <div class="pair" id="pair"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const w = Number(q.get('w') || 720);
    const fig = (src, label, note) => `<figure><figcaption>${label}<span>${note || ''}</span></figcaption><img src="${src}" width="${w}" alt="${label}"></figure>`;
    document.getElementById('pair').innerHTML = fig(q.get('a'), q.get('la') || '原版', q.get('na')) + fig(q.get('b'), q.get('lb') || '精修', q.get('nb'));
  </script>
</body>
</html>
