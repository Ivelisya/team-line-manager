<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>团队线路管理（原版复现）</title>
<script>
  // 仿原生壳：?theme=dark|light 控制外观；?view=large|compact|mini 写入首页视图会话；?bare=1 只显示 iframe
  (function () {
    var q = new URLSearchParams(location.search);
    var theme = q.get('theme') || 'light';
    try { localStorage.setItem('appearance', JSON.stringify(theme)); } catch (e) {}
    if (theme === 'dark') document.documentElement.classList.add('dark');
    var view = q.get('view');
    try {
      if (view) sessionStorage.setItem('komaritheme:node-view-mode-session:desktop', view);
      else sessionStorage.removeItem('komaritheme:node-view-mode-session:desktop');
      var group = q.get('group');
      if (group) sessionStorage.setItem('komari:admin-home-group', group); else sessionStorage.removeItem('komari:admin-home-group');
    } catch (e) {}
    if (q.get('bare')) document.documentElement.classList.add('bare');
  })();
</script>
<style>
  :root { --page:#f5f6fa; --panel:#fff; --soft:#f0f1f6; --text:#262936; --muted:#687084; --border:rgba(57,65,90,.12); --accent:#676ee8; --accent-soft:rgba(103,110,232,.12);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; font-size:13px; color:var(--text); }
  html.dark { --page:#15161b; --panel:#1d1f27; --soft:#252833; --text:#e7e9f1; --muted:#959db1; --border:rgba(184,191,215,.12); --accent:#9399ff; --accent-soft:rgba(147,153,255,.16); color-scheme:dark; }
  html,body { margin:0; height:100%; background:var(--page); }
  .top { height:56px; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  .top b { font-size:15px; font-weight:650; letter-spacing:.015em; }
  .top .ctl { display:flex; gap:7px; }
  .top .ctl span { width:34px; height:34px; border-radius:9px; background:var(--soft); display:inline-block; }
  .body { display:flex; height:calc(100% - 56px); }
  nav { width:240px; flex:none; box-sizing:border-box; padding:10px; background:var(--panel); border-right:1px solid var(--border); overflow:auto; }
  nav a { display:flex; align-items:center; gap:10px; height:36px; padding:7px 10px; box-sizing:border-box; border-radius:9px; color:var(--text); text-decoration:none; font-weight:500; }
  nav a i { width:16px; height:16px; border-radius:4px; background:var(--border); display:inline-block; }
  nav a.on { background:var(--accent-soft); color:var(--accent); }
  nav a.on i { background:var(--accent); opacity:.6; }
  nav .sub { margin-left:12px; border-left:1px solid var(--border); padding-left:5px; }
  main { flex:1; min-width:0; }
  iframe { width:100%; height:100%; border:0; display:block; background:var(--page); }
  html.bare .top, html.bare nav { display:none; }
  html.bare .body { height:100%; }
</style>
</head>
<body>
<div class="top"><b>团队线路管理</b><div class="ctl"><span></span><span></span><span></span><span></span></div></div>
<div class="body">
  <nav>
    <a class="on"><i></i>首页</a><a><i></i>运营总览</a><a><i></i>节点</a><a><i></i>线路</a><a><i></i>节点行为</a><a><i></i>运维</a>
    <div class="sub"><a><i></i>主机配置</a><a><i></i>主机统计</a><a><i></i>延迟监测</a><a><i></i>远程执行</a><a><i></i>会话管理</a><a><i></i>API 密钥</a><a><i></i>工作台</a></div>
    <a><i></i>通知</a><a><i></i>主题</a><a><i></i>插件</a><a><i></i>系统</a><a><i></i>账户</a>
  </nav>
  <main><iframe id="f" title="服务器首页" sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts allow-downloads"></iframe></main>
</div>
<script>
  var path = location.pathname.replace(/^\/admin\/home/, '') || '/';
  var f = document.getElementById('f');
  f.src = '/api/admin/plugin/team-ops/home/#' + path;
  window.addEventListener('message', function (e) {
    if (e.source !== f.contentWindow) return;
    if (e.data && e.data.type === 'lumina:route') {
      var p = '/admin/home' + (e.data.path === '/' ? '' : e.data.path);
      history.replaceState(null, '', p + location.search);
    }
  });
</script>
</body>
</html>
