<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Smoke Test</title>
<!-- Verification harness for prototype/shared only. Deliberately plain: it is not a design direction. -->
<style>
  :root {
    --canvas: #f6f6f5; --surface: #fff; --border-subtle: #ececea; --border: #dcdcd8; --border-strong: #b9b9b3;
    --text-1: #1b1b19; --text-2: #63635e; --text-3: #8f8f89;
    --ok-dot: #2f9e5b; --warn-dot: #d4930d; --bad-dot: #d9442f; --info-dot: #2f6fd9; --unknown-ring: #8f8f89;
    --ok-text: #1f7a43; --warn-text: #8a5d00; --bad-text: #b8321f; --info-text: #2458b3;
    --chart-1: #2f6fd9; --chart-2: #d9772f; --chart-grid: #ececea; --chart-axis: #8f8f89; --chart-zero: #b9b9b3;
    --chart-seq-1: #e3ecfb; --chart-seq-2: #b9cff4; --chart-seq-3: #86abea; --chart-seq-4: #4f82dd; --chart-seq-5: #2458b3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --canvas: #151514; --surface: #1c1c1b; --border-subtle: #2a2a28; --border: #353533; --border-strong: #52524e;
    --text-1: #ededea; --text-2: #a5a5a0; --text-3: #75756f;
    --ok-dot: #3fb96d; --warn-dot: #e5a82a; --bad-dot: #ec5b45; --info-dot: #5b8fe8; --unknown-ring: #75756f;
    --ok-text: #5fd08a; --warn-text: #f0c060; --bad-text: #ff8a78; --info-text: #8fb3f2;
    --chart-1: #5b8fe8; --chart-2: #e8914f; --chart-grid: #2a2a28; --chart-axis: #75756f; --chart-zero: #52524e;
    color-scheme: dark;
  }
  body { margin: 0; padding: 16px; background: var(--canvas); color: var(--text-1); font: 13px/20px system-ui, "PingFang SC", sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .n { font-variant-numeric: tabular-nums; }
  .unit { font-size: 11px; color: var(--text-2); }
  table { border-collapse: collapse; width: 100%; background: var(--surface); font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 8px; border-bottom: 1px solid var(--border-subtle); text-align: left; white-space: nowrap; }
  td.r, th.r { text-align: right; }
  tr.cur { outline: 2px solid var(--info-dot); outline-offset: -2px; }
  tr.sel { background: var(--border-subtle); }
  .t-warn { color: var(--warn-text); } .t-bad { color: var(--bad-text); } .t-muted { color: var(--text-3); } .t-ok { color: var(--ok-text); }
  .chart { background: var(--surface); border: 1px solid var(--border); margin: 8px 0; padding: 4px 0; }
  .ts-tip { background: var(--surface); border: 1px solid var(--border); padding: 4px 8px; font-variant-numeric: tabular-nums; }
  .ts-tick, .ts-unit, .ts-marker, .ts-threshold { font-size: 11px; }
  .ts-legend { font-size: 12px; padding: 0 8px; }
  #palette { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: 560px; background: var(--surface); border: 1px solid var(--border); padding: 8px; display: none; }
  #palette.open { display: block; }
  #palette .act { background: var(--border-subtle); }
  #log { font: 12px/18px ui-monospace, monospace; color: var(--text-2); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bar">
  <strong>shared/ smoke</strong>
  <span id="fresh" class="n"></span>
  <input id="q" placeholder="搜索（/）team: relay: status: cap: ip: due:<7d" size="44">
  <span id="segs"></span>
  <button id="theme">主题</button>
  <button id="unit">Mbps / MiB/s</button>
  <button id="replay">回放 09-23 09:11</button>
  <button id="event">触发状态变化</button>
</div>
<div id="kpis" class="bar n"></div>
<div id="fleet" class="chart"></div>
<div id="lat" class="chart"></div>
<table>
  <thead><tr><th></th><th>节点</th><th>线路</th><th>状态</th><th class="r">TCP</th><th class="r">出口</th><th>近 30 天</th><th class="r">↓</th><th class="r">↑</th><th>趋势</th><th class="r">今日</th><th class="r">CPU</th><th class="r">月费</th><th class="r">到期</th><th>TCP 条</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="palette"><input id="pq" size="60"><div id="pl"></div></div>
<div id="log"></div>
<script type="module">
import * as fmt from './format.js';
import { loadSnapshot, nodeTableConfig, paletteItems } from './data.js';
import { createLive, createPatcher } from './live.js';
import { createTable } from './table.js';
import { createKeys, createPalette, defaultBindings } from './keys.js';
import * as charts from './charts.js';

const t0 = performance.now();
const params = new URLSearchParams(location.search);
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; };
window.__smoke = { errors: [] };
window.addEventListener('error', (e) => window.__smoke.errors.push(String(e.message)));

let store = await loadSnapshot();
if (params.get('stress')) store = store.stressed(+params.get('stress'));
const tLoad = performance.now();
const live = createLive(store, { eventRate: +(params.get('rate') ?? 1) });
const table = createTable(nodeTableConfig(store, { resortThrottleMs: 5000 }));
table.fromParams(location.search);
const patch = createPatcher();
const $rows = document.getElementById('rows');

const tone = (f) => (f.tone === 'warn' ? 't-warn' : f.tone === 'bad' ? 't-bad' : f.tone === 'muted' ? 't-muted' : '');
function cells(n) {
  const h = fmt.health(n.status.code, { stale: store.staleOf(n) });
  const line = fmt.statusLine(n.status);
  const tcp = fmt.latency(n.latency.tcp_ms), eg = fmt.latency(n.latency.egress_ms);
  const due = fmt.due(n.billing);
  return {
    sel: table.isSelected(n.id) ? '●' : '',
    name: `${fmt.esc(n.name)}<br><span class="t-muted">${fmt.esc(fmt.ip(n.ip).text)}</span>`,
    relay: `${fmt.esc(n.team)}<br><span class="t-muted">${fmt.esc(n.entry_label)}</span>`,
    status: `<span style="color:${charts.statusColor(h.code)}">●</span> ${h.word}<br><span class="${tone(line)} t-muted">${fmt.esc(line.text)}</span>`,
    tcp: `<span class="t-${fmt.latencyTone(n.latency.tcp_ms, 'tcp', n.limits) ?? 'muted'}">${fmt.html(tcp)}</span>`,
    eg: `<span class="t-${fmt.latencyTone(n.latency.egress_ms, 'egress', n.limits) ?? 'muted'}">${fmt.html(eg)}</span>`,
    avail: `${charts.tracker(n.availability.tracker30)} ${fmt.pctAvail(n.availability.windows['30'].availability_percent).text}`,
    down: fmt.html(fmt.rate(n.rate.down_bps)),
    up: fmt.html(fmt.rate(n.rate.up_bps)),
    spark: n.host_spark ? charts.sparkline(n.host_spark.net_rx_bps) : '<span class="t-muted">无主机</span>',
    today: fmt.html(fmt.bytes(n.traffic.today.down + n.traffic.today.up)),
    cpu: n.hasHost ? fmt.html(fmt.pctResource(n.host.cpu_pct)) : '<span class="t-muted">无主机</span>',
    cost: fmt.html(fmt.monthlyFee(n.billing)),
    due: `<span class="${tone(due)}">${fmt.esc(due.text)}</span>${due.badge ? ` <small>${due.badge}</small>` : ''}`,
    strip: n.latency.strip_tcp ? charts.latencyStrip(n.latency.strip_tcp, { limits: n.limits }) : '<span class="t-muted">—</span>',
  };
}
const KEYS = ['sel', 'name', 'relay', 'status', 'tcp', 'eg', 'avail', 'down', 'up', 'spark', 'today', 'cpu', 'cost', 'due', 'strip'];
const RIGHT = new Set(['tcp', 'eg', 'down', 'up', 'today', 'cpu', 'cost', 'due']);
function renderRows() {
  const rows = table.rows();
  $rows.innerHTML = rows.map((n) => `<tr data-id="${n.id}" class="${table.cursor() === n.id ? 'cur' : ''} ${table.isSelected(n.id) ? 'sel' : ''}">${KEYS.map((k) => `<td data-k="${k}" class="${RIGHT.has(k) ? 'r' : ''}"></td>`).join('')}</tr>`).join('');
  patch.forget();
  for (const n of rows) patchRow(n);
}
let patchedCells = 0;
function patchRow(n) {
  const tr = $rows.querySelector(`tr[data-id="${CSS.escape(n.id)}"]`);
  if (!tr) return;
  const c = cells(n);
  for (const k of KEYS) if (patch.changed(`${n.id}:${k}`, c[k])) { tr.querySelector(`[data-k="${k}"]`).innerHTML = c[k]; patchedCells++; }
}
function renderKpis() {
  const k = store.kpis();
  const br = fmt.ratePair(k.business_rate.down_bps, k.business_rate.up_bps);
  document.getElementById('kpis').innerHTML = [
    `正常 ${k.normal.ok}/${k.normal.total}`, `需处理 ${k.attention}`, `业务速率 ${br.text}`,
    charts.mirrorSparkline(k.business_rate.spark.down_bps, k.business_rate.spark.up_bps),
    `今日 ${fmt.bytes(k.today_business.total)}`, `7 天内到期 ${k.due_7d.count}`, `每月费用 ${fmt.money(k.monthly_cost.cents)}`,
    `事件 ${fmt.int(k.events_today)}`,
  ].join(' · ');
  document.getElementById('segs').textContent = table.segmentCounts().map((s) => `${s.label} ${s.count}`).join(' · ');
}
renderRows();
renderKpis();
const tFirst = performance.now();
log(`load ${Math.round(tLoad - t0)} ms · first render ${Math.round(tFirst - t0)} ms · rows ${table.count()}`);

// charts: fleet mirror (1-min buckets), latency with threshold (lazy series)
const f = store.fleetTraffic();
const [xs, down, up] = charts.columnar(f, ['down', 'up'], { toRate: true });
const pk = charts.peakOf(xs, down);
const fleetChart = await charts.mountMirror(document.getElementById('fleet'), {
  xs, down, up, height: 200, syncKey: 'smoke',
  markers: [{ x: pk.x, y: pk.y, label: `峰值 ${fmt.rate(pk.y).text} · ${fmt.clockTime(pk.x)}` }],
});
const lat = await store.series('t2-01', 'latency_24h');
const latData = [charts.xsOf(lat.t0, lat.step, lat.tcp.avg_ms.length), lat.tcp.avg_ms];
const latChart = await charts.mountTimeSeries(document.getElementById('lat'), {
  data: latData, kind: 'ms', height: 160, syncKey: 'smoke', series: [{ label: 'TCP 均值 · 团队2-01', color: 'var(--chart-1)' }],
  thresholds: [{ value: 100, label: '降级阈值 100 ms' }],
});
log(`charts mounted ${Math.round(performance.now() - t0)} ms`);

live.on((d) => {
  if (d.events.length) log(d.events.map((e) => `${fmt.clockTime(d.now)} ${e.type} ${e.id ?? e.incident?.name} ${e.from ?? ''}→${e.to ?? ''}`).join('\n'));
  table.invalidate();
  const before = patchedCells;
  if (d.events.some((e) => e.type === 'status' || e.type === 'attention')) renderRows();
  else for (const id of Object.keys(d.nodes)) { const n = store.node(id); if (n) patchRow(n); }
  window.__smoke.lastPatched = patchedCells - before;
  renderKpis();
  if (d.fleet['traffic.fleet_24h']) { const [x2, d2, u2] = charts.columnar(store.fleetTraffic(), ['down', 'up'], { toRate: true }); fleetChart.setData([x2, d2, u2]); }
});
live.start();
setInterval(() => { document.getElementById('fresh').textContent = fmt.freshnessPill(live.age() ?? 0, 'komari').text + ' · ' + fmt.absolute(store.now()); }, 1000);

// keys + palette
const keys = createKeys();
const pal = createPalette({ items: () => [
  { id: 'go:nodes', group: '跳转', title: '节点', run: () => log('go nodes') },
  { id: 'go:relays', group: '跳转', title: '线路机', run: () => log('go relays') },
  ...paletteItems(store, (k, id) => { log('open', k, id); table.setCursor(id); renderRows(); }),
  { id: 'act:restart', group: '操作', title: '重启 Xray 线路机2', danger: true, run: () => log('restart!') },
] });
const $pal = document.getElementById('palette'), $pq = document.getElementById('pq'), $pl = document.getElementById('pl');
let popPal = null;
function drawPal() {
  $pl.innerHTML = pal.grouped().map((g) => `<div class="t-muted">${g.group}</div>` + g.items.map((r) => `<div class="${r.index === pal.active() ? 'act' : ''}">${fmt.esc(r.item.title)} <span class="t-muted">${fmt.esc(r.item.subtitle ?? '')}</span></div>`).join('')).join('');
}
pal.on((e) => { if (e.reason === 'close' || e.reason === 'run') { $pal.classList.remove('open'); popPal?.(); popPal = null; } else drawPal(); });
function openPal() { pal.open(); $pal.classList.add('open'); $pq.value = ''; $pq.focus(); popPal = keys.pushScope('palette', { exclusive: true }); drawPal(); }
$pq.addEventListener('input', () => pal.setQuery($pq.value));
keys.bindAll(pal.keyBindings());
keys.bindAll(defaultBindings({ palette: () => (pal.isOpen ? pal.close() : openPal()), focusSearch: () => document.getElementById('q').focus(), goNodes: () => log('g n → 节点'), goRelays: () => log('g r → 线路机'), help: () => log(keys.list().map((g) => g.group + ': ' + g.items.map((i) => `${i.labels[0]} ${i.desc}`).join('，')).join('\n')) }));
keys.bindAll(table.keyBindings({ open: (id) => log('open drawer', id), close: () => false }).map((b) => ({ ...b, scope: 'global' })));
keys.start();
table.on((e) => { if (e.reason === 'cursor' || e.reason === 'selection') { for (const tr of $rows.children) { tr.classList.toggle('cur', tr.dataset.id === table.cursor()); tr.classList.toggle('sel', table.isSelected(tr.dataset.id)); } } else if (e.reason !== 'data') { renderRows(); renderKpis(); } });
let qT = null;
document.getElementById('q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => table.setQuery(e.target.value), 150); });
document.getElementById('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
document.getElementById('unit').onclick = () => { fmt.setRateUnit(fmt.getRateUnit() === 'bit' ? 'byte' : 'bit'); patch.forget(); renderRows(); renderKpis(); fleetChart.setData(fleetChart.uplot.data.map((a, i) => (i === 2 ? a.map((v) => (v == null ? v : -v)) : a))); };
document.getElementById('replay').onclick = () => { store.replay === 0 ? store.clearReplay() : store.applyReplay(0); table.invalidate(); renderRows(); renderKpis(); };
document.getElementById('event').onclick = () => live.triggerEvent();
Object.assign(window.__smoke, { store, live, table, keys, pal, fleetChart, latChart, fmt, charts, timings: { load: tLoad - t0, first: tFirst - t0 } });
</script>
</body>
</html>
