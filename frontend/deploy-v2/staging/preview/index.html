<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时数据预览</title>
<style>
  :root { --bg:#f6f7f9; --surface:#fff; --text-1:#1b1f24; --text-2:#5b6470; --text-3:#8a929c; --border:#e3e6ea;
          --ok:#1f9d55; --warn:#c77700; --bad:#d64545; --info:#2f6fd6; --muted:#8a929c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --surface:#181c21; --text-1:#e6e9ed; --text-2:#a3abb5; --text-3:#6f7883; --border:#2a3038; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text-1); font:13px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding:14px 16px 8px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .sub { color:var(--text-2); font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; border:1px solid var(--border); color:var(--text-2); }
  .pill[data-tone=ok] { color:var(--ok); border-color:currentColor; } .pill[data-tone=warn] { color:var(--warn); border-color:currentColor; } .pill[data-tone=bad] { color:var(--bad); border-color:currentColor; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; padding:0 16px 12px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .kpi b { display:block; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi span { color:var(--text-3); font-size:12px; }
  .wrap { padding:0 16px 24px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
  th { color:var(--text-3); font-weight:500; font-size:12px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .tone-ok { color:var(--ok); } .tone-warn { color:var(--warn); } .tone-bad { color:var(--bad); } .tone-muted, .tone-unknown { color:var(--muted); }
  .flash { animation: flash .8s ease-out; } @keyframes flash { from { background: rgba(47,111,214,.14); } to { background: transparent; } }
  .banner { margin:0 16px 12px; padding:10px 12px; border-radius:8px; border:1px solid var(--bad); color:var(--bad); background:var(--surface); display:none; }
  .banner a { color:inherit; font-weight:600; }
  .note { color:var(--text-3); padding:0 16px 16px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>团队线路管理 · 实时数据预览</h1>
  <span class="sub" id="asof">正在读取…</span>
  <span class="pill" id="fresh">—</span>
  <span class="sub" id="req"></span>
</header>
<div class="banner" id="banner"></div>
<section class="kpis" id="kpis"></section>
<div class="wrap"><table>
  <thead><tr><th>节点</th><th>状态</th><th>线路</th><th class="num">业务速率</th><th class="num">今日</th><th class="num">TCP</th><th class="num">出口</th><th class="num">CPU</th><th class="num">近 30 天</th><th class="num">到期</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<p class="note">测试服：数据来自生产库副本（只读、隔离网络），界面只用于核对实时适配层；正式页面由 deploy/v2/dist 提供。</p>
<script type="module" src="./preview.js"></script>
</body>
</html>
