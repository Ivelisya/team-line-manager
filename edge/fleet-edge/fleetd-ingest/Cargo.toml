[package]
name = "fleetd-ingest"
version = "0.1.0"
edition = "2021"
description = "fleetd 的边缘上报接收模块：/v2/ingest/{node,relay}、主机最新值与 1 分钟汇总、Xray 计数、原生告警钩子、agent 令牌"
publish = false

[lib]
path = "src/lib.rs"

# 测试服专用：独立运行接收模块（a395 验收用），生产由 fleetd 挂载 router
[[bin]]
name = "ingest-testd"
path = "src/bin/ingest_testd.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
